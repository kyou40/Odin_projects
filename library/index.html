<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My library</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 id="my-library">My Library</h1>
      <button class="btn-primary" id="new-book-btn">New Book</button>
    </header>
    <main>
      <div class="library-container"></div>
    </main>
    <dialog id="new-book-dialog">
      <form id="new-book-form">
        <h2>Add a new book</h2>

        <div class="form-row">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required />
        </div>

        <div class="form-row">
          <label for="author">Author</label>
          <input type="text" id="author" name="author" required />
        </div>

        <div class="form-row">
          <label for="pages">Pages</label>
          <input type="number" min="1" id="pages" name="pages" required />
        </div>

        <div class="form-row-checkbox">
          <input type="checkbox" id="read" name="read" value="Read" />
          <label for="read">I have read this book</label>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" id="cancel-btn">
            Cancel
          </button>
          <button type="submit" class="btn-primary" id="confirm-btn">
            Confirm
          </button>
        </div>
      </form>
    </dialog>
  </body>
</html>
