<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="library">
      <h1 id="library-title">Library</h1>
      <div class="display-book" id="display-book"></div>
      <button class="btn" id="new-book-btn">New Book</button>
      <dialog id="new-book">
        <form id="new-book-form">
          <div class="form-row">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required />
          </div>
          <div class="form-row">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" required />
          </div>
          <div class="form-row">
            <label for="pages">Pages</label>
            <input type="number" min="1" id="pages" name="pages" required />
          </div>
          <div class="form-row">
            <label for="read">Have you read this book?</label>
            <input type="checkbox" id="read" name="read" value="Read" />
          </div>
          <button
            type="button"
            value="cancel"
            id="cancel-btn"
            formmethod="dialog"
            formnovalidate
          >
            Cancel
          </button>
          <button id="confirm-btn" type="submit">Confirm</button>
        </form>
      </dialog>
    </div>
  </body>
</html>
